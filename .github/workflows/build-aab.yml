name: Build Android APK/AAB (Bubblewrap)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 10406996
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Init Bubblewrap project
        run: |
          rm -rf bubblewrap_out
          bubblewrap init \
            --manifest https://raw.githubusercontent.com/nico46OP/compagnons-de-route/main/manifest.json \
            --directory bubblewrap_out \
            --short-name "Compagnons" \
            --application-name "Compagnons de Route" \
            --package-id "com.compagnonsderoute"

      - name: Build Debug APK (for testing)
        working-directory: bubblewrap_out
        run: |
          bubblewrap build --mode debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bubblewrap-artifacts
          path: |
            bubblewrap_out/**/*.apk
            bubblewrap_out/**/*.aab

            bubblewrap_out/*.aab
            bubblewrap_out/*.apk
